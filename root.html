<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>side-burger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
</head>
<body>
    <side-burger>
        <template shadowrootmode="open"><?start><?start>
            <style adopt>
                :host {
                    display: block;
                    --drawer-width: 280px;
                    --primary-color: #1976d2;
                    --surface-color: #ffffff;
                    --on-surface-color: #212121;
                    --overlay-color: rgba(0, 0, 0, 0.5);
                    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
                }

                :host[hidden] {
                    display: none;
                }

                button {
                    font: inherit;
                    cursor: pointer;
                    border: none;
                    background: transparent;
                }

                .hamburger {
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    gap: 8px;
                    /* Sizes to content so a slotted text label fits; stays a
                       48px circle when it only holds the default icon. */
                    min-width: 48px;
                    height: 48px;
                    padding: 0 12px;
                    color: var(--on-surface-color);
                    border-radius: 24px;
                    transition: background-color 0.2s ease;
                }

                .hamburger:hover {
                    background-color: rgba(0, 0, 0, 0.04);
                }

                .hamburger:focus-visible {
                    outline: 2px solid var(--primary-color);
                    outline-offset: 2px;
                }

                .hamburger svg,
                slot[name="hamburger"]::slotted(svg) {
                    width: 24px;
                    height: 24px;
                }

                .overlay {
                    position: fixed;
                    inset: 0;
                    background-color: var(--overlay-color);
                    opacity: 0;
                    pointer-events: none;
                    transition: opacity 0.3s ease;
                    z-index: 999;
                }

                .drawer {
                    position: fixed;
                    top: 0;
                    bottom: 0;
                    left: 0;
                    width: var(--drawer-width);
                    max-width: 85vw;
                    background-color: var(--surface-color);
                    box-shadow:
                        0 8px 10px -5px rgba(0, 0, 0, 0.2),
                        0 16px 24px 2px rgba(0, 0, 0, 0.14),
                        0 6px 30px 5px rgba(0, 0, 0, 0.12);
                    transform: translateX(-100%);
                    visibility: hidden;
                    transition:
                        transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        visibility 0.3s;
                    z-index: 1000;
                    display: flex;
                    flex-direction: column;
                    touch-action: none;
                    user-select: none;
                    /* Promote to its own compositor layer so the swipe drag
                       (inline translateX from the swipe-dismiss feature) never
                       triggers a paint of the drawer or its box-shadow. */
                    will-change: transform;
                }

                /* .drawer[data-dragging] {
                    transition: none;
                } */

                .drag-handle {
                    position: absolute;
                    left: -12px;
                    top: 50%;
                    transform: translateY(-50%);
                    width: 12px;
                    height: 48px;
                    background: rgba(0, 0, 0, 0.2);
                    border-radius: 6px 0 0 6px;
                    cursor: grab;
                    touch-action: none;
                }

                :host([position="right"]) .drag-handle {
                    left: auto;
                    right: -12px;
                    border-radius: 0 6px 6px 0;
                }

                .drawer:not([inert]) {
                    transform: translateX(0);
                    visibility: visible;
                }

                :host([position="right"]) .drawer {
                    left: auto;
                    right: 0;
                    transform: translateX(100%);
                }

                :host([position="right"]) .drawer:not([inert]) {
                    transform: translateX(0);
                }

                .overlay[aria-hidden="false"] {
                    opacity: 1;
                    pointer-events: auto;
                }

                .drawer-header {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    padding: 16px;
                    border-bottom: 1px solid rgba(0, 0, 0, 0.12);
                }

                .drawer-title {
                    margin: 0;
                    font-size: 1.25rem;
                    font-weight: 500;
                    color: var(--on-surface-color);
                }

                .close {
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    width: 36px;
                    height: 36px;
                    padding: 6px;
                    color: var(--on-surface-color);
                    border-radius: 50%;
                    transition: background-color 0.2s ease;
                }

                .close:hover {
                    background-color: rgba(0, 0, 0, 0.04);
                }

                .close:focus-visible {
                    outline: 2px solid var(--primary-color);
                    outline-offset: 2px;
                }

                .content {
                    flex: 1;
                    overflow-y: auto;
                    padding: 8px 0;
                    /* Allow vertical scrolling of a long menu, but let the
                       swipe-dismiss feature claim horizontal drags even when
                       the gesture starts on a slotted link. `touch-action`
                       does not inherit, so it must be set here (and on
                       ::slotted content) rather than only on .drawer. */
                    touch-action: pan-y;
                }

                ::slotted(*) {
                    touch-action: pan-y;
                }

                ::slotted(nav) {
                    display: block;
                }

                ::slotted(menu),
                ::slotted(ul) {
                    list-style: none;
                    margin: 0;
                    padding: 0;
                }

                ::slotted(li) {
                    margin: 0;
                }

                ::slotted(a) {
                    display: block;
                    padding: 12px 16px;
                    color: var(--on-surface-color);
                    text-decoration: none;
                    transition: background-color 0.2s ease;
                }

                ::slotted(a:hover),
                ::slotted(a:focus) {
                    background-color: rgba(0, 0, 0, 0.04);
                }
            </style>

            <button
                name="hamburger"
                class="hamburger"
                part="hamburger"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="drawer"
                type="button">
                <slot name="hamburger">
                    <svg viewBox="0 0 24 24" part="open-icon" aria-hidden="true" focusable="false">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/>
                    </svg>
                </slot>
            </button>

            <div name="overlay" class="overlay" part="overlay" aria-hidden="true"></div>

            <div
                id="drawer"
                class="drawer"
                part="drawer"
                role="dialog"
                aria-modal="true"
                aria-labelledby="drawer-title"
                inert>
                <div class="drag-handle" part="drag-handle" aria-hidden="true"></div>
                <div class="drawer-header" part="drawer-header">
                    <h2 id="drawer-title" class="drawer-title" part="drawer-title">Menu</h2>
                    <button
                        name="close"
                        class="close"
                        part="close"
                        aria-label="Close navigation menu"
                        type="button">
                        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
                <div class="content" part="content">
                    <slot></slot>
                </div>
            </div>
        <?end><?end></template>
    </side-burger>
</body>
</html>
